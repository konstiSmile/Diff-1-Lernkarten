<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Karteikarten</title>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1b1a18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Karteikarten">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root {
    --bg:#1b1a18; --paper:#262421; --paper2:#2e2b27; --ink:#ece7df; --muted:#a59e93; --line:#3a3732; --accent:#8fb6dc; --amber:#e8c547;
    --c-diff:#8fb6dc; --c-quer:#d9a86c; --c-psy:#c58fb8;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body { background:var(--bg); color:var(--ink); font:15px/1.5 -apple-system, system-ui, "Segoe UI", sans-serif;
    -webkit-text-size-adjust:100%; min-height:100vh; min-height:100dvh; }
  .wrap { max-width:640px; margin:0 auto; padding:max(28px, env(safe-area-inset-top)) 18px max(32px, env(safe-area-inset-bottom)); }
  h1 { font-family:"New York", Georgia, "Source Serif 4", serif; font-weight:600; font-size:1.9rem; letter-spacing:-.01em; margin:8px 0 14px; }

  .search { position:relative; margin-bottom:16px; }
  .search input { width:100%; font:16px -apple-system, system-ui, sans-serif; color:var(--ink); background:var(--paper);
    border:1px solid var(--line); border-radius:14px; padding:13px 40px 13px 42px; -webkit-appearance:none; appearance:none; }
  .search input:focus { outline:none; border-color:var(--accent); }
  .search input::-webkit-search-cancel-button { display:none; }
  .search .lens { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none; font-size:1.05rem; }
  .search .clear { position:absolute; right:8px; top:50%; transform:translateY(-50%); width:30px; height:30px; border:0; border-radius:50%;
    background:var(--paper2); color:var(--muted); font-size:1rem; cursor:pointer; display:none; }
  .search.has .clear { display:block; }

  .grid { display:grid; gap:14px; }
  .tile { position:relative; display:flex; flex-direction:column; justify-content:space-between; min-height:128px; padding:18px 20px;
    background:var(--paper); border:1px solid var(--line); border-radius:18px; color:inherit; text-decoration:none;
    box-shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); -webkit-tap-highlight-color:transparent; transition:transform .15s ease, border-color .15s ease; }
  a.tile:active { transform:scale(.98); }
  a.tile:hover { border-color:var(--muted); }
  .tile .name { font-family:"New York", Georgia, "Source Serif 4", serif; font-size:1.5rem; font-weight:600; margin:0; }
  .tile .desc { color:var(--muted); font-size:.88rem; margin:2px 0 0; }
  .tile .foot { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:16px; font-size:.82rem; color:var(--muted); }
  .bar { flex:1; height:4px; background:var(--line); border-radius:4px; overflow:hidden; }
  .bar > div { height:100%; width:0; transition:width .3s; background:var(--accent); }
  .go { font-weight:600; white-space:nowrap; }
  .stripe { position:absolute; left:0; top:18px; bottom:18px; width:4px; border-radius:0 4px 4px 0; }
  .t-diff .stripe, .t-diff .go { background:var(--c-diff); } .t-diff .go { background:none; color:var(--c-diff); }
  .t-quer .stripe { background:var(--c-quer); } .t-quer .go { color:var(--c-quer); } .t-quer .bar > div { background:var(--c-quer); }
  .t-psy .stripe { background:var(--c-psy); } .t-psy .go { color:var(--c-psy); } .t-psy .bar > div { background:var(--c-psy); }
  .badge { position:absolute; top:16px; right:16px; font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);
    border:1px solid var(--line); border-radius:999px; padding:2px 10px; }

  /* Suche */
  #results { display:none; }
  .searching #results { display:block; }
  .searching .grid { display:none; }
  .filters { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .filters button { border:1px solid var(--line); background:var(--paper); color:var(--muted); border-radius:999px; padding:5px 13px;
    font:500 .84rem -apple-system, system-ui, sans-serif; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
  .filters button.on { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .filters .sw { width:9px; height:9px; border-radius:50%; display:inline-block; }
  .count { color:var(--muted); font-size:.82rem; margin:0 2px 10px; }
  .hit { position:relative; display:block; color:inherit; text-decoration:none; background:var(--paper); border:1px solid var(--line);
    border-radius:14px; padding:12px 14px 12px 18px; margin-bottom:10px; -webkit-tap-highlight-color:transparent; overflow:hidden; }
  .hit:active { transform:scale(.99); }
  .hit::before { content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--hc); }
  .hit .top { display:flex; align-items:center; gap:8px; font-size:.76rem; margin-bottom:4px; flex-wrap:wrap; }
  .hit .subj { font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--hc); }
  .hit .ttl { color:var(--ink); font-weight:600; }
  .hit .typ { color:var(--muted); margin-left:auto; }
  .hit .snip { color:var(--muted); font-size:.88rem; font-family:"New York", Georgia, serif; }
  mark { background:var(--amber); color:#1b1a18; border-radius:3px; padding:0 2px; }
  .none { text-align:center; color:var(--muted); padding:36px 10px; }

  @media (min-width:800px) {
    .wrap { max-width:880px; padding-top:64px; }
    h1 { font-size:2.3rem; }
    .grid { grid-template-columns:repeat(3, 1fr); gap:18px; }
    .tile { min-height:190px; }
  }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <h1>Karteikarten</h1>

  <div class="search" id="searchbox">
    <span class="lens">⌕</span>
    <input id="q" type="search" placeholder="Begriff oder Satz suchen …" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search" aria-label="Suche">
    <button class="clear" id="clear" aria-label="Suche löschen">✕</button>
  </div>

  <div id="results">
    <div class="filters" id="filters"></div>
    <div class="count" id="count"></div>
    <div id="hits"></div>
  </div>

  <div class="grid">
    <a class="tile t-diff" href="diff1.html">
      <span class="stripe"></span>
      <div><h2 class="name">Diff1</h2><p class="desc">Differential- und Integralrechnung 1 · Karteikarten</p></div>
      <div class="foot"><span id="diffProg">Kapitel 1</span><div class="bar"><div id="diffBar"></div></div><span class="go">Öffnen ›</span></div>
    </a>
    <a class="tile t-quer" href="querschnitt.html">
      <span class="stripe"></span>
      <div><h2 class="name">Querschnitt</h2><p class="desc">Kapitel 10 · Tests: Multiple Choice, Lückentext, Richtig/Falsch, Zeit-Simulation</p></div>
      <div class="foot"><span id="querProg">__QN__ Fragen</span><div class="bar"><div id="querBar"></div></div><span class="go">Öffnen ›</span></div>
    </a>
    <a class="tile t-psy" href="psycho2.html">
      <span class="stripe"></span>
      <span class="badge">Gerüst</span>
      <div><h2 class="name">Psycho2</h2><p class="desc">Test-Funktionen mit Beispielfragen</p></div>
      <div class="foot"><span>Inhalte folgen</span><span class="go">Öffnen ›</span></div>
    </a>
  </div>
</div>

<script>
window.INDEX = __INDEX__;
(function () {
  'use strict';
  var SUBJ = { diff1: { name: 'Diff1', c: '#8fb6dc' }, quer: { name: 'Querschnitt', c: '#d9a86c' }, psy: { name: 'Psycho2', c: '#c58fb8' } };
  var IDX = window.INDEX;

  // Fortschritt auf den Kacheln
  function rd(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
  var s = rd('dif1-k1-status') || {}, known = Object.keys(s).filter(function (k) { return s[k] === 'known'; }).length;
  if (known > 0) { document.getElementById('diffProg').textContent = known + ' von 19 gewusst'; document.getElementById('diffBar').style.width = (known / 19 * 100) + '%'; }
  var qs = rd('quer-k10');
  if (qs && qs.best && qs.best.exam !== undefined) { document.getElementById('querProg').textContent = 'Klausur-Bestwert ' + qs.best.exam + ' %'; document.getElementById('querBar').style.width = qs.best.exam + '%'; }

  // ----- Suche -----
  function nrm(s) { return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ß/g, 'ss'); }
  // normalisierter Text samt Zuordnung zurück zu den Originalpositionen
  function mapNorm(s) {
    var out = '', map = [];
    for (var i = 0; i < s.length; i++) {
      var c = nrm(s[i]);
      for (var j = 0; j < c.length; j++) { out += c[j]; map.push(i); }
    }
    return { t: out, m: map };
  }
  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  IDX.forEach(function (e) { e._h = nrm(e.title + ' ' + e.kw); e._t = nrm(e.text); });

  var input = document.getElementById('q'), box = document.getElementById('searchbox'), wrap = document.getElementById('wrap');
  var filter = 'all';

  function search(q) {
    var toks = nrm(q).split(/\s+/).filter(function (t) { return t.length > 0; });
    if (!toks.length) return [];
    var res = [];
    IDX.forEach(function (e, n) {
      var score = 0;
      for (var i = 0; i < toks.length; i++) {
        var t = toks[i], inH = e._h.indexOf(t) >= 0, inT = e._t.indexOf(t) >= 0;
        if (!inH && !inT) return;
        score += (inH ? 3 : 0) + (inT ? 1 : 0);
      }
      res.push({ e: e, score: score, n: n });
    });
    res.sort(function (a, b) { return b.score - a.score || a.n - b.n; });
    return { list: res, toks: toks };
  }

  function snippet(text, toks) {
    var mn = mapNorm(text), pos = -1;
    for (var i = 0; i < toks.length; i++) { var p = mn.t.indexOf(toks[i]); if (p >= 0 && (pos < 0 || p < pos)) pos = p; }
    var start = 0, end = Math.min(text.length, 170);
    if (pos >= 0) {
      var o = mn.m[pos];
      start = Math.max(0, o - 55); end = Math.min(text.length, o + 115);
      var sp = text.lastIndexOf(' ', start + 12); if (start > 0 && sp > 0 && sp < o) start = sp + 1;
    }
    // Treffer-Bereiche im Ausschnitt markieren
    var ranges = [];
    toks.forEach(function (t) {
      var from = 0, p;
      while ((p = mn.t.indexOf(t, from)) >= 0) {
        var a = mn.m[p], b = mn.m[p + t.length - 1] + 1;
        if (a >= start && b <= end) ranges.push([a, b]);
        from = p + t.length;
      }
    });
    ranges.sort(function (x, y) { return x[0] - y[0]; });
    var html = '', cur = start;
    ranges.forEach(function (r) {
      if (r[0] < cur) return;
      html += esc(text.slice(cur, r[0])) + '<mark>' + esc(text.slice(r[0], r[1])) + '</mark>'; cur = r[1];
    });
    html += esc(text.slice(cur, end));
    return (start > 0 ? '… ' : '') + html + (end < text.length ? ' …' : '');
  }

  function render() {
    var q = input.value.trim();
    var on = q.length > 0;
    wrap.classList.toggle('searching', on); box.classList.toggle('has', input.value.length > 0);
    if (!on) return;
    var r = search(q);
    var list = r.list || [], toks = r.toks || [];
    var counts = { all: list.length, diff1: 0, quer: 0, psy: 0 };
    list.forEach(function (x) { counts[x.e.s]++; });
    var fl = document.getElementById('filters');
    fl.innerHTML = [['all', 'Alle', null], ['diff1', 'Diff1', SUBJ.diff1.c], ['quer', 'Querschnitt', SUBJ.quer.c]].map(function (f) {
      return '<button data-f="' + f[0] + '" class="' + (filter === f[0] ? 'on' : '') + '">' + (f[2] ? '<span class="sw" style="background:' + f[2] + '"></span>' : '') + f[1] + ' (' + counts[f[0]] + ')</button>';
    }).join('');
    Array.prototype.forEach.call(fl.querySelectorAll('button'), function (b) { b.onclick = function () { filter = b.dataset.f; render(); }; });
    var shown = list.filter(function (x) { return filter === 'all' || x.e.s === filter; });
    document.getElementById('count').textContent = shown.length ? shown.length + (shown.length === 1 ? ' Treffer' : ' Treffer') : '';
    var hl = encodeURIComponent(q);
    document.getElementById('hits').innerHTML = shown.length ? shown.slice(0, 40).map(function (x) {
      var e = x.e, sj = SUBJ[e.s];
      var sep = e.url.indexOf('#') >= 0 ? '&' : '#';
      return '<a class="hit" style="--hc:' + sj.c + '" href="' + e.url + sep + 'hl=' + hl + '">' +
        '<div class="top"><span class="subj">' + sj.name + '</span><span class="ttl">' + esc(e.title) + '</span><span class="typ">' + esc(e.label) + '</span></div>' +
        '<div class="snip">' + snippet(e.text, toks) + '</div></a>';
    }).join('') : '<div class="none">Keine Treffer für „' + esc(q) + '“.</div>';
  }

  input.addEventListener('input', render);
  document.getElementById('clear').onclick = function () { input.value = ''; render(); input.focus(); };
  render();
})();
if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
</script>
</body>
</html>
