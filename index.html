<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Karteikarten</title>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1b1a18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Karteikarten">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root {
    --bg: #1b1a18; --paper: #262421; --ink: #ece7df; --muted: #a59e93;
    --line: #3a3732; --accent: #8fb6dc; --green: #6cc49f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, system-ui, "Segoe UI", sans-serif;
    -webkit-text-size-adjust: 100%;
    min-height: 100vh; min-height: 100dvh;
  }
  .wrap {
    max-width: 640px; margin: 0 auto;
    padding: max(28px, env(safe-area-inset-top)) 18px max(32px, env(safe-area-inset-bottom));
  }
  h1 {
    font-family: "New York", Georgia, "Source Serif 4", serif;
    font-weight: 600; font-size: 1.9rem; letter-spacing: -.01em; margin: 8px 0 4px;
  }
  .sub { color: var(--muted); margin: 0 0 26px; }

  .grid { display: grid; gap: 14px; }
  .tile {
    position: relative; display: flex; flex-direction: column; justify-content: space-between;
    min-height: 128px; padding: 18px 20px;
    background: var(--paper); border: 1px solid var(--line); border-radius: 18px;
    color: inherit; text-decoration: none;
    box-shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    -webkit-tap-highlight-color: transparent;
    transition: transform .15s ease, border-color .15s ease;
  }
  a.tile:active { transform: scale(.98); }
  a.tile:hover { border-color: var(--accent); }
  .tile .name {
    font-family: "New York", Georgia, "Source Serif 4", serif;
    font-size: 1.5rem; font-weight: 600; margin: 0;
  }
  .tile .desc { color: var(--muted); font-size: .88rem; margin: 2px 0 0; }
  .tile .foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; font-size: .82rem; color: var(--muted); }
  .bar { flex: 1; height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .go { color: var(--accent); font-weight: 600; white-space: nowrap; }

  .tile.soon { opacity: .55; cursor: default; }
  .badge {
    position: absolute; top: 16px; right: 16px;
    font-size: .72rem; letter-spacing: .06em; text-transform: uppercase;
    color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px;
  }
  .stripe { position: absolute; left: 0; top: 18px; bottom: 18px; width: 4px; border-radius: 0 4px 4px 0; }
  .t-diff .stripe { background: var(--accent); }
  .t-quer .stripe { background: #d9a86c; }
  .t-psy .stripe { background: #c58fb8; }

  @media (min-width: 800px) {
    .wrap { max-width: 880px; padding-top: 64px; }
    h1 { font-size: 2.3rem; }
    .grid { grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .tile { min-height: 190px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Karteikarten</h1>
  <p class="sub">Fach auswählen</p>

  <div class="grid">
    <a class="tile t-diff" href="diff1.html">
      <span class="stripe"></span>
      <div>
        <h2 class="name">Diff1</h2>
        <p class="desc">Differential- und Integralrechnung 1</p>
      </div>
      <div class="foot">
        <span id="diffProg">Kapitel 1</span>
        <div class="bar"><div id="diffBar"></div></div>
        <span class="go">Öffnen ›</span>
      </div>
    </a>

    <div class="tile soon t-quer" aria-disabled="true">
      <span class="stripe"></span>
      <span class="badge">bald</span>
      <div>
        <h2 class="name">Querschnitt</h2>
        <p class="desc">Noch keine Karten</p>
      </div>
    </div>

    <div class="tile soon t-psy" aria-disabled="true">
      <span class="stripe"></span>
      <span class="badge">bald</span>
      <div>
        <h2 class="name">Psycho2</h2>
        <p class="desc">Noch keine Karten</p>
      </div>
    </div>
  </div>
</div>

<script>
// Lernfortschritt von Diff1 (Kapitel 1) auf der Kachel anzeigen
(function () {
  var TOTAL = 19;
  try {
    var s = JSON.parse(localStorage.getItem('dif1-k1-status') || '{}');
    var known = Object.keys(s).filter(function (k) { return s[k] === 'known'; }).length;
    if (known > 0) {
      document.getElementById('diffProg').textContent = known + ' von ' + TOTAL + ' gewusst';
      document.getElementById('diffBar').style.width = (known / TOTAL * 100) + '%';
    }
  } catch (e) {}
})();
if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
</script>
</body>
</html>
